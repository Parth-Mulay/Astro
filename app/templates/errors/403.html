<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Access Restricted — AstroMatch</title>
    <link rel="stylesheet" href="/static/css/theme.css">
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: #0f172a;
            color: #f8fafc;
            font-family: system-ui, -apple-system, sans-serif;
            text-align: center;
            margin: 0;
            padding: 1.5rem;
        }
        .card {
            background: #1e293b;
            padding: 3rem 2rem;
            border-radius: 16px;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4);
            border: 1px solid #334155;
        }
        h1 {
            font-size: 5rem;
            margin: 0 0 1rem;
            color: #ef4444;
            line-height: 1;
            font-weight: 800;
            background: linear-gradient(135deg, #ef4444 0%, #b91c1c 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        h2 {
            font-size: 1.5rem;
            margin-bottom: 1rem;
            color: #e2e8f0;
        }
        p {
            color: #94a3b8;
            font-size: 1rem;
            margin-bottom: 2rem;
            line-height: 1.6;
        }
        .btn {
            display: inline-block;
            padding: 12px 24px;
            background: #f97316;
            color: white;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            transition: background 0.2s;
        }
        .btn:hover {
            background: #ea580c;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>403</h1>
        <h2>🔒 Access Restricted</h2>
        <p>{{ detail if detail else "You do not have the required permissions to view this celestial alignment." }}</p>
        <a href="/" class="btn">Return to Home</a>
    </div>
</body>
</html>
