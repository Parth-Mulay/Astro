user nginx;
worker_processes auto;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging Configurations
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log warn;

    # Performance Optimizations
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;

    # Gzip Compression
    gzip on;
    gzip_disable "msie6";
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Rate Limiting Zones (Limit connections per IP)
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;

    # Upstream backend
    upstream app_backend {
        server web:8000;
        keepalive 32;
    }

    # SERVER BLOCK: HTTP Redirect to HTTPS & Certbot Challenge
    server {
        listen 80;
        listen [::]:80;
        server_name astromatch.local; # Replace with production domain

        # Certbot challenge path
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # Redirect all HTTP requests to HTTPS
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # SERVER BLOCK: HTTPS Production Server
    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name astromatch.local; # Replace with production domain

        # SSL Certificates (Uncomment and replace paths when SSL is set up via Certbot)
        # ssl_certificate /etc/letsencrypt/live/astromatch.local/fullchain.pem;
        # ssl_certificate_key /etc/letsencrypt/live/astromatch.local/privkey.pem;
        
        # Self-signed/Temporary fallback certificates (Nginx will boot successfully)
        # Note: In production, generate Let's Encrypt certificates using Certbot.
        ssl_certificate /etc/ssl/certs/ssl-cert-snakeoil.pem;
        ssl_certificate_key /etc/ssl/private/ssl-cert-snakeoil.key;

        # Secure SSL Protocols and Ciphers
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;
        ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
        
        # SSL Sessions Optimize
        ssl_session_timeout 1d;
        ssl_session_cache shared:SSL:10m;
        ssl_session_tickets off;

        # Secure Headers (Clickjacking, MIME Sniffing, XSS protection)
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://checkout.razorpay.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://*.razorpay.com; frame-src 'self' https://api.razorpay.com https://checkout.razorpay.com; connect-src 'self' https://api.razorpay.com;" always;

        # Client uploads limits (Max size of profile uploads / reports)
        client_max_body_size 10M;

        # Serve static assets directly (Highly Cached)
        location /static/ {
            alias /var/www/static/;
            expires 30d;
            access_log off;
            add_header Cache-Control "public, no-transform";
        }

        # Serve uploaded media files directly
        location /uploads/ {
            alias /var/www/uploads/;
            expires 30d;
            access_log off;
            add_header Cache-Control "public, no-transform";
            add_header Content-Disposition "attachment; filename=$1"; # Force download security
            add_header X-Content-Type-Options "nosniff" always;
        }

        # Serve reports directly
        location /reports/ {
            alias /var/www/reports/;
            expires 7d;
            access_log off;
            add_header Cache-Control "private, no-transform";
            add_header Content-Disposition "attachment";
            add_header X-Content-Type-Options "nosniff" always;
        }

        # Proxy to ASGI/Gunicorn Backend
        location / {
            # Apply Rate Limit Zone
            limit_req zone=api_limit burst=20 nodelay;

            proxy_pass http://app_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_redirect off;
            
            # Proxy Timeouts
            proxy_connect_timeout 60s;
            proxy_read_timeout 120s;
            proxy_send_timeout 120s;
        }

        # Custom Nginx Error Pages
        error_page 404 /static/errors/404.html;
        error_page 403 /static/errors/403.html;
        error_page 500 502 504 /static/errors/500.html;
        error_page 503 /static/errors/503.html;

        location ~ ^/static/errors/ {
            alias /var/www/static/errors/;
            internal;
        }
    }
}
